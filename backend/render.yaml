databases:
  - name: bost-postgres-db
    databaseName: bost_manifest_db
    user: bost_user
    plan: free
    region: oregon

services:
  - type: web
    name: bost-manifest-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn bost_manifest.wsgi:application --bind 0.0.0.0:$PORT --workers 3"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: "bost_manifest.settings.prod"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bost-postgres-db
          property: connectionString
      - key: MONGO_URI
        sync: false # Set to your MongoDB Atlas connection string in Render Dashboard
      - key: MONGO_DB_NAME
        value: "bost_manifest_docs"
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://your-bost-app.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        sync: false # e.g. https://your-bost-app.vercel.app
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,.onrender.com,.vercel.app"
